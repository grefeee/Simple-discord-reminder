name: Discord Reminder

on:
  schedule:
    - cron: '57 8,11,14,17,20,23 * * *'
    - cron: '27 10,13,16,19,22 * * *'   
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Reminder
        run: |
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d '{"content":"<@&1569034259014881291>"}' \
            "${{ secrets.WEBHOOK_URL }}"   
